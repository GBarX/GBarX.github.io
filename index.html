<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Berk — Software Engineer · Java & Security</title>
<meta name="description" content="Portfolio of Berk (GBarX) — Software Engineering student focused on Java backend development and cybersecurity." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

<script>
/* ============================================================
   SITE_DATA — SİTENİN TÜM İÇERİĞİ BURADA. (only place you edit)
   ------------------------------------------------------------
   Yeni proje eklemek için: projects listesine aşağıdaki gibi
   bir blok kopyala-yapıştır, kaydet, push'la. Hepsi bu.

   {
     title: "Project Name",
     status: "Active",            // Active | Completed | Archived
     tags: ["Java", "Security"],
     desc: "One or two sentences about it.",
     link: "https://github.com/GBarX/repo-name"
   }

   Skill seviyeleri 1–5 arası (5 segmentli entropy bar).
   ============================================================ */
const SITE_DATA = {
  name: "Berk",
  handle: "GBarX",
  tagline: "Software Engineering student building secure, well-structured backend software in Java.",
  role: "Software Engineering @ Işık University · Istanbul, TR",
  status: "Backend & AppSec intern-in-training — currently interning at a software house in Istanbul.",

  socials: [
    { label: "GitHub", url: "https://github.com/GBarX" },
    { label: "X · @thebitstack", url: "https://x.com/thebitstack" },
    { label: "Email", url: "mailto:hello@example.com" } // <- kendi mailini yaz
  ],

  about: [
    "I'm a third-year Software Engineering student at Işık University. Most of my work lives at the intersection of two things I care about: writing clean, object-oriented Java, and understanding how software gets attacked — and how to design it so it doesn't.",
    "Right now I'm deep in two tracks. On the engineering side, I'm growing my Password Security Checker from a single class into a properly packaged tool with a Strategy-pattern generator. On the security side, I'm working through the Google Cybersecurity Certificate and TryHackMe's Linux path, heading toward CompTIA Security+.",
    "I build in public on X as @thebitstack — dev logs, SQL breakdowns, and the occasional hot take."
  ],

  skills: [
    { name: "Java", level: 5, note: "OOP, custom data structures, design patterns" },
    { name: "SQL & Databases", level: 3, note: "MySQL, normalization, EER modeling" },
    { name: "Linux & Shell", level: 3, note: "Permissions, filesystem, TryHackMe labs" },
    { name: "Security Fundamentals", level: 3, note: "AppSec mindset, Google Cyber cert track" },
    { name: "Git & GitHub", level: 4, note: "Issues, Projects boards, clean history" },
    { name: "PHP", level: 2, note: "Used in ICMS — conference management system" }
  ],

  projects: [
    {
      title: "Password Security Checker",
      status: "Active",
      tags: ["Java", "Security", "CLI"],
      desc: "Password strength analysis tool, now evolving into a small security platform. v0.2 introduces a Strategy-pattern generator (random + passphrase) behind a clean PasswordGenerator interface, tracked on a 10-issue roadmap.",
      link: "https://github.com/GBarX/password-strength-checker"
    },
    {
      title: "File System Simulator",
      status: "Completed",
      tags: ["Java", "Data Structures"],
      desc: "In-memory file system built UML-first: directories, files and traversal implemented on custom tree structures rather than library shortcuts.",
      link: "https://github.com/GBarX"
    },
    {
      title: "Leaderboard & Match History",
      status: "Completed",
      tags: ["Java", "Heaps", "Hash Tables"],
      desc: "Ranking system with match history — an excuse to put heaps and hash tables to real use instead of leaving them in a textbook.",
      link: "https://github.com/GBarX"
    },
    {
      title: "ICMS — Conference Management System",
      status: "Completed",
      tags: ["PHP", "MySQL", "Team Project"],
      desc: "Full conference management system built for a Database Systems course, including a normalization quality report. Shipped as a three-person team.",
      link: "https://github.com/GBarX"
    },
    {
      title: "Vehicle Management System",
      status: "Archived",
      tags: ["Java", "OOP"],
      desc: "Early OOP project — inheritance, interfaces and polymorphism applied to a fleet management domain.",
      link: "https://github.com/GBarX"
    }
  ],

  learning: [
    { name: "Google Cybersecurity Certificate", detail: "Modules completed: Foundations · Play It Safe · Connect and Protect · Linux and SQL", state: "In progress" },
    { name: "TryHackMe — Linux Fundamentals", detail: "Hands-on Linux labs and room walkthroughs", state: "In progress" },
    { name: "Java Data Structures & Algorithms", detail: "Coursera specialization", state: "Completed" },
    { name: "CompTIA Security+", detail: "Next milestone on the security track", state: "Up next" }
  ]
};
</script>

<style>
:root {
  --bg: #10161f;
  --bg-raise: #161e29;
  --line: #26303d;
  --ink: #e9edf2;
  --ink-dim: #97a3b2;
  --amber: #f0a830;
  --amber-soft: rgba(240, 168, 48, 0.14);
  --teal: #4fb3a9;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --display: "Chakra Petch", var(--sans);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--amber); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
a:focus-visible, button:focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 3px;
  border-radius: 2px;
}

.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 24px;
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 64px;
}

/* ---------- Sidebar ---------- */
aside {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 56px 0;
  display: flex;
  flex-direction: column;
}
.brand {
  font-family: var(--display);
  font-weight: 700;
  font-size: 2rem;
  letter-spacing: 0.01em;
  line-height: 1.1;
}
.brand .handle {
  display: block;
  font-family: var(--mono);
  font-size: 0.8rem;
  font-weight: 400;
  color: var(--ink-dim);
  margin-top: 8px;
}
.role {
  margin-top: 18px;
  color: var(--ink-dim);
  font-size: 0.92rem;
  max-width: 26ch;
}
nav { margin-top: 48px; }
nav a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 0;
  color: var(--ink-dim);
  font-family: var(--mono);
  font-size: 0.85rem;
  letter-spacing: 0.04em;
}
nav a .tick {
  width: 22px; height: 2px;
  background: var(--line);
  transition: width 0.25s, background 0.25s;
}
nav a:hover, nav a.active { color: var(--ink); text-decoration: none; }
nav a:hover .tick, nav a.active .tick { width: 40px; background: var(--amber); }
.side-socials { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.side-socials a { font-family: var(--mono); font-size: 0.82rem; color: var(--ink-dim); }
.side-socials a:hover { color: var(--amber); }

/* ---------- Main ---------- */
main { padding: 56px 0 96px; min-width: 0; }
section { padding: 56px 0; }
section + section { border-top: 1px solid var(--line); }

.eyebrow {
  font-family: var(--mono);
  font-size: 0.78rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--teal);
  margin-bottom: 22px;
}

/* Hero */
#hero { padding-top: 24px; min-height: 62vh; display: flex; flex-direction: column; justify-content: center; }
.prompt {
  font-family: var(--mono);
  font-size: 0.85rem;
  color: var(--ink-dim);
  margin-bottom: 20px;
}
.prompt::before { content: "~/" attr(data-user) " $ "; color: var(--teal); }
h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(2rem, 4.6vw, 3.4rem);
  line-height: 1.15;
  max-width: 21ch;
}
h1 .accent { color: var(--amber); }
.hero-status {
  margin-top: 26px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 0.82rem;
  color: var(--ink-dim);
  border: 1px solid var(--line);
  padding: 10px 14px;
  border-radius: 4px;
  background: var(--bg-raise);
  width: fit-content;
}
.pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 0 0 rgba(79,179,169,0.5);
  animation: pulse 2.2s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(79,179,169,0.45); }
  70% { box-shadow: 0 0 0 9px rgba(79,179,169,0); }
  100% { box-shadow: 0 0 0 0 rgba(79,179,169,0); }
}

/* Entropy bar — the signature element */
.entropy { display: flex; gap: 5px; }
.entropy span {
  width: 26px; height: 6px;
  background: var(--line);
  border-radius: 1px;
}
.entropy span.on { background: var(--amber); }
.entropy.small span { width: 18px; height: 5px; }

/* About */
#about p { color: var(--ink-dim); max-width: 62ch; }
#about p + p { margin-top: 16px; }
#about p strong, #about p a { color: var(--ink); }

/* Skills */
.skill-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.skill {
  border: 1px solid var(--line);
  background: var(--bg-raise);
  border-radius: 6px;
  padding: 18px 20px;
}
.skill .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
.skill h3 { font-family: var(--display); font-size: 1rem; font-weight: 600; }
.skill .note { font-size: 0.85rem; color: var(--ink-dim); }

/* Projects */
.project {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 24px;
  background: var(--bg-raise);
  transition: border-color 0.2s, transform 0.2s;
}
.project + .project { margin-top: 14px; }
.project:hover { border-color: var(--amber); transform: translateX(4px); }
.project .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; }
.project h3 { font-family: var(--display); font-size: 1.15rem; font-weight: 600; }
.project h3 a { color: var(--ink); }
.badge {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 3px;
  border: 1px solid var(--line);
  color: var(--ink-dim);
}
.badge.Active { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
.badge.Completed { color: var(--teal); border-color: rgba(79,179,169,0.5); }
.project p { color: var(--ink-dim); margin-top: 10px; font-size: 0.95rem; max-width: 68ch; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.tags li {
  list-style: none;
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--teal);
}
.tags li::before { content: "#"; opacity: 0.6; }

/* Learning */
.learn { border-left: 2px solid var(--line); padding-left: 22px; }
.learn-item { position: relative; padding: 4px 0 22px; }
.learn-item::before {
  content: "";
  position: absolute;
  left: -27px; top: 12px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--teal);
}
.learn-item h3 { font-family: var(--display); font-size: 1rem; font-weight: 600; display: inline; }
.learn-item .state {
  font-family: var(--mono); font-size: 0.72rem;
  color: var(--amber); margin-left: 10px;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.learn-item p { color: var(--ink-dim); font-size: 0.88rem; margin-top: 4px; }

/* Contact / footer */
#contact .big {
  font-family: var(--display);
  font-size: clamp(1.4rem, 2.6vw, 2rem);
  font-weight: 600;
  max-width: 26ch;
}
.contact-links { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 24px; }
.contact-links a {
  font-family: var(--mono);
  font-size: 0.88rem;
  border: 1px solid var(--line);
  padding: 12px 18px;
  border-radius: 4px;
  color: var(--ink);
  transition: border-color 0.2s, background 0.2s;
}
.contact-links a:hover { border-color: var(--amber); background: var(--amber-soft); text-decoration: none; }
footer {
  padding: 26px 0 8px;
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--ink-dim);
  border-top: 1px solid var(--line);
}

/* Reveal on scroll */
.reveal { opacity: 0; transform: translateY(14px); transition: opacity 0.5s ease, transform 0.5s ease; }
.reveal.in { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .reveal { opacity: 1; transform: none; transition: none; }
  .pulse { animation: none; }
  .project:hover { transform: none; }
}

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .wrap { grid-template-columns: 1fr; gap: 0; }
  aside { position: static; height: auto; padding: 40px 0 8px; }
  nav { display: none; }
  .side-socials { margin-top: 22px; flex-direction: row; gap: 18px; }
  main { padding-top: 8px; }
  .skill-grid { grid-template-columns: 1fr; }
  #hero { min-height: auto; padding-top: 40px; }
}
</style>
</head>
<body>

<div class="wrap">
  <aside>
    <div class="brand" id="brand-name"></div>
    <p class="role" id="brand-role"></p>
    <nav aria-label="Sections">
      <a href="#about"><span class="tick"></span>about</a>
      <a href="#skills"><span class="tick"></span>skills</a>
      <a href="#projects"><span class="tick"></span>projects</a>
      <a href="#learning"><span class="tick"></span>learning</a>
      <a href="#contact"><span class="tick"></span>contact</a>
    </nav>
    <div class="side-socials" id="side-socials"></div>
  </aside>

  <main>
    <section id="hero">
      <p class="prompt" id="prompt">whoami</p>
      <h1 id="tagline"></h1>
      <div class="hero-status"><span class="pulse" aria-hidden="true"></span><span id="status-text"></span></div>
    </section>

    <section id="about" class="reveal">
      <p class="eyebrow">// about</p>
      <div id="about-body"></div>
    </section>

    <section id="skills" class="reveal">
      <p class="eyebrow">// skills — entropy check</p>
      <div class="skill-grid" id="skill-grid"></div>
    </section>

    <section id="projects" class="reveal">
      <p class="eyebrow">// projects</p>
      <div id="project-list"></div>
    </section>

    <section id="learning" class="reveal">
      <p class="eyebrow">// learning track</p>
      <div class="learn" id="learn-list"></div>
    </section>

    <section id="contact" class="reveal">
      <p class="eyebrow">// contact</p>
      <p class="big">Open to internships, junior backend roles, and interesting security problems.</p>
      <div class="contact-links" id="contact-links"></div>
    </section>

    <footer id="footer"></footer>
  </main>
</div>

<script>
/* ---------- Rendering (buraya dokunmana gerek yok) ---------- */
const D = SITE_DATA;
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const entropy = (level, small) =>
  `<div class="entropy${small ? " small" : ""}" role="img" aria-label="Level ${level} of 5">` +
  Array.from({ length: 5 }, (_, i) => `<span class="${i < level ? "on" : ""}"></span>`).join("") +
  `</div>`;

document.title = `${D.name} — Software Engineer · Java & Security`;
document.getElementById("brand-name").innerHTML =
  `${esc(D.name)}<span class="handle">@${esc(D.handle)}</span>`;
document.getElementById("brand-role").textContent = D.role;
document.getElementById("prompt").dataset.user = D.handle;
document.getElementById("status-text").textContent = D.status;

// Tagline: highlight "Java" and "secur..." words in amber
document.getElementById("tagline").innerHTML = esc(D.tagline)
  .replace(/\b(Java|secure|security)\b/gi, '<span class="accent">$1</span>');

document.getElementById("side-socials").innerHTML =
  D.socials.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a>`).join("");

document.getElementById("about-body").innerHTML =
  D.about.map(p => `<p>${esc(p)}</p>`).join("");

document.getElementById("skill-grid").innerHTML = D.skills.map(s => `
  <div class="skill">
    <div class="top"><h3>${esc(s.name)}</h3>${entropy(s.level, true)}</div>
    <p class="note">${esc(s.note)}</p>
  </div>`).join("");

document.getElementById("project-list").innerHTML = D.projects.map(p => `
  <article class="project">
    <div class="head">
      <h3><a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title)}</a></h3>
      <span class="badge ${esc(p.status)}">${esc(p.status)}</span>
    </div>
    <p>${esc(p.desc)}</p>
    <ul class="tags">${p.tags.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
  </article>`).join("");

document.getElementById("learn-list").innerHTML = D.learning.map(l => `
  <div class="learn-item">
    <h3>${esc(l.name)}</h3><span class="state">${esc(l.state)}</span>
    <p>${esc(l.detail)}</p>
  </div>`).join("");

document.getElementById("contact-links").innerHTML =
  D.socials.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join("");

document.getElementById("footer").textContent =
  `© ${new Date().getFullYear()} ${D.name} · built by hand, content is data-driven · read-only for you, editable for me`;

// Scroll reveal + active nav
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) e.target.classList.add("in");
}), { threshold: 0.12 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));

const navLinks = document.querySelectorAll("nav a");
const secObs = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) {
    navLinks.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id));
  }
}), { rootMargin: "-40% 0px -55% 0px" });
document.querySelectorAll("main section").forEach(s => secObs.observe(s));
</script>
</body>
</html>
